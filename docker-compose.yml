services:
  app:
    build: .
    image: bitrix-bridge
    container_name: bitrix-bridge
    restart: unless-stopped
    env_file: python/.env
    expose:
      - "8000"
    volumes:
      - data:/app/data
      # Лог в Google Sheets: положить ключ сервисного аккаунта в python/google-credentials.json
      # и прописать в python/.env GOOGLE_CREDENTIALS_FILE=/app/google-credentials.json
      # - ./python/google-credentials.json:/app/google-credentials.json:ro

  nginx:
    build: ./nginx
    image: bitrix-bridge-nginx
    container_name: bitrix-bridge-nginx
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v4.0.0
    container_name: bitrix-bridge-certbot
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet
          sleep 12h & wait $$!
        done
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  data:
  certbot-conf:
  certbot-www:
